name: Feature request
description: Suggest an improvement to Rivet
body:
  - type: textarea
    id: need
    attributes:
      label: What are you trying to do?
      description: Describe the table or character workflow and the edition you play.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested improvement
  - type: textarea
    id: source
    attributes:
      label: Rules source or other context
      description: For mechanics changes, include the edition and SRD reference where possible.
